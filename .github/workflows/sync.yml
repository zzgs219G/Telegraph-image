name: Sync to Sub-Account

on:
  push:
    branches:
      - main  # 如果你大号的主分支不叫 main 而是 master，请把 main 改成 master

jobs:
  git-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Sub-Account
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          
          # 注意：下面这一行我做了一处关键修改，去掉了最后的 :main
          git push --force https://${{ secrets.SYNC_TOKEN }}@github.com/xi118/Telegraph-image.git main
