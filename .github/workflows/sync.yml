name: Sync to Sub-Account

on:
  push:
    branches:
      - main

jobs:
  repo-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync Push
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          
          # 【核心改变】换成了专门针对私人仓库的高权限强制推流写法
          git push --force https://x-access-token:${{ secrets.SYNC_TOKEN }}@github.com/xi118/Telegraph-image.git main:main
