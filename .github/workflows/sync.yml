name: Sync to Sub-Account

on:
  push:
    branches:
      - main

jobs:
  git-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Sub-Account
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          
          # 这一行已经换成了你刚才发给我的小号链接
          git push --force https://${{ secrets.SYNC_TOKEN }}@github.com/xi118/Telegraph-image.git main:main
